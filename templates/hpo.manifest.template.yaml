# Pathfinder onboarding manifest (template)
# Copy to hpo.manifest.yaml and fill in. The agent uses this during onboarding to
# scaffold active_search_space.json + hpo_config.json and a thin worker. Human-readable;
# nothing parses it at runtime today.

study_name: my_study

# Optuna optimization directions. The broker/dashboard assume two objectives:
#   bce -> minimize, dice -> maximize (multi-objective Pareto).
# Keep both unless you switch the study to single-objective.
objectives:
  - metric: bce
    direction: minimize
  - metric: dice
    direction: maximize

# Keys your worker reports back each epoch and at completion.
metric_keys:
  primary: dice          # higher is better
  secondary: bce         # lower is better
  # Optional fixed-resolution eval metrics (only if eval_protocol.enabled):
  # fixed_primary: dice_eval_fixed
  # fixed_secondary: bce_eval_fixed

# Path to the worker script that runs training and calls hpo_client.TrialSession.
worker_entrypoint: worker.py   # e.g. start from templates/worker_minimal.py

# Free-form hints the agent should respect when proposing the search space.
constraint_hints:
  - "batch_size must be a power of 2"
  - "high resolution + large batch_size can OOM the GPU"
  - "learning_rate is best searched on a log scale"
