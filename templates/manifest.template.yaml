# Pathfinder HPO Manifest
# -----------------------
# This file defines your hyperparameter search space and metrics.
# Write it yourself or have an AI generate it from your training script.
# Validate:  python hpo_cli.py validate this_file.yaml
# Register:  python hpo_cli.py init this_file.yaml

study_name: my_study           # unique name for this experiment

metrics:
  primary_score: accuracy      # which objective to highlight in dashboards
  objectives:
    - name: accuracy           # must match what your worker reports
      direction: maximize       # "maximize" or "minimize"
      label: "Accuracy"         # display name in dashboard

params:
  - name: learning_rate
    type: float_log             # float | float_log | int | categorical | bool | fixed
    min: 0.0001
    max: 0.1
  - name: batch_size
    type: categorical
    options: [16, 32, 64, 128]
  # - name: use_augmentation    # uncomment for boolean params
  #   type: bool
  # - name: seed               # uncomment for fixed (non-tuned) params
  #   type: fixed
  #   value: 42

# Optional: eval protocol for train-vs-fixed-eval honesty checks
# eval_protocol:
#   enabled: true
#   fixed_resolution: 512
#   train_resolution_param: resolution
#   score_eval_attr: score_eval_fixed
#   loss_eval_attr: loss_eval_fixed

worker:
  entrypoint: python train.py   # how to run your training script
  # env:                        # optional environment variables
  #   CUDA_VISIBLE_DEVICES: "0"

# Optional: project context for the coordinator
# project_context:
#   description: "Fine-tuning BERT for sentiment analysis"
#   dataset: "imdb_reviews"
