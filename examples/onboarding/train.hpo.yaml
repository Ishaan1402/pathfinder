# examples/onboarding/train.hpo.yaml
# Sample manifest for onboarding a custom PyTorch model to Pathfinder.
study_name: "mnist_tuning"

metrics:
  primary_score: "accuracy"
  objectives:
    - name: "accuracy"
      direction: "maximize"
      label: "Validation Accuracy"
    - name: "loss"
      direction: "minimize"
      label: "Cross-Entropy Loss"

params:
  - name: "learning_rate"
    type: "float_log"
    min: 1e-4
    max: 1e-1
  - name: "batch_size"
    type: "categorical"
    options: [32, 64, 128]
  - name: "dropout"
    type: "float"
    min: 0.1
    max: 0.5

worker:
  entrypoint: "python train.py --lr {learning_rate} --batch_size {batch_size} --dropout {dropout}"
  env:
    CUDA_VISIBLE_DEVICES: "0"
