[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder"
version = "1.0.0"
description = "Decoupled hyperparameter optimization (HPO) framework with periodically scheduled AI coordinator reviews"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ishaan Patel", email = "ishbhagat02@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.1,<2",
    "optuna>=3.6,<5",
    "sqlalchemy>=2.0,<3",

    "pydantic>=2.0,<3",
    "numpy>=1.20,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.23,<1",
    "requests>=2.28,<3",
    "PyYAML>=6.0,<7",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:optuna.*",
    "ignore::DeprecationWarning:sqlalchemy.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pathfinder = "hpo_cli:main"

[tool.setuptools]
py-modules = ["hpo_cli", "broker", "hpo_mcp_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "simulators*", "backups*"]
